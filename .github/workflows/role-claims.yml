# Role claims: each role (A-E) has an issue labelled `role`. A collaborator
# comments `/claim` on their role's issue; this workflow assigns them, swaps
# the `unclaimed` label for `claimed`, puts their handle in the title and
# replies with next steps. `/unclaim` reverses it (claimant or repo owner).
#
# Security (C16): issues:write only; the comment text is read from the event
# payload inside JavaScript and never interpolated into a shell or script;
# only repository collaborators can claim; one role per person.
name: role-claims

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

concurrency:
  group: role-claims
  cancel-in-progress: false

jobs:
  claim:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'role')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const command = (comment.body || '').trim().toLowerCase();
            if (command !== '/claim' && command !== '/unclaim') return;

            const user = comment.user.login;
            const reply = (body) => github.rest.issues.createComment(
              { owner, repo, issue_number: issue.number, body });
            const baseTitle = issue.title.replace(/\s+—\s+claimed by @\S+$/, '');
            const current = (issue.assignees || []).map(a => a.login);

            if (command === '/claim') {
              if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(comment.author_association)) {
                return reply(`@${user} only repository collaborators can claim a role. ` +
                             'Accept your invitation to the repository first, then comment `/claim` again.');
              }
              if (current.length && !current.includes(user)) {
                return reply(`@${user} this role is already claimed by @${current[0]}. ` +
                             'If that is a mistake, they (or the repo owner) can comment `/unclaim`.');
              }
              if (current.includes(user)) return reply(`@${user} you already hold this role.`);

              const mine = await github.paginate(github.rest.issues.listForRepo,
                { owner, repo, labels: 'role', assignee: user, state: 'all' });
              const other = mine.find(i => i.number !== issue.number);
              if (other) {
                return reply(`@${user} you already claimed #${other.number} (${other.title}). ` +
                             'Comment `/unclaim` there first if you meant this role instead.');
              }

              await github.rest.issues.addAssignees(
                { owner, repo, issue_number: issue.number, assignees: [user] });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number,
                title: `${baseTitle} — claimed by @${user}` });
              await github.rest.issues.removeLabel(
                { owner, repo, issue_number: issue.number, name: 'unclaimed' }).catch(() => {});
              await github.rest.issues.addLabels(
                { owner, repo, issue_number: issue.number, labels: ['claimed'] });
              return reply([
                `✅ Claimed by @${user}.`,
                '',
                'Next steps:',
                '1. Read `docs/plan/README.md`, `01-interfaces.md`, then your role file in `docs/plan/`.',
                '2. Open a small PR that uncomments your lines in `CODEOWNERS` with your handle ' +
                '(replace the `<X>` placeholder). That makes you the required reviewer for your areas.',
                '3. Work on branches and open PRs; fill in the PR template (including the AI-assistance section).',
              ].join('\n'));
            }

            // /unclaim
            const isOwner = comment.author_association === 'OWNER';
            if (!current.includes(user) && !isOwner) {
              return reply(`@${user} only the person holding this role or the repo owner can unclaim it.`);
            }
            if (!current.length) return reply('This role is not claimed.');
            await github.rest.issues.removeAssignees(
              { owner, repo, issue_number: issue.number, assignees: current });
            await github.rest.issues.update(
              { owner, repo, issue_number: issue.number, title: baseTitle });
            await github.rest.issues.removeLabel(
              { owner, repo, issue_number: issue.number, name: 'claimed' }).catch(() => {});
            await github.rest.issues.addLabels(
              { owner, repo, issue_number: issue.number, labels: ['unclaimed'] });
            return reply(`Role released by @${user}. Anyone can now comment \`/claim\`.`);
