# Lint and format rules for all Python in the repo (backend, scripts, tests).
target-version = "py313"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM"]
ignore = ["S101"]  # assert is fine

[lint.per-file-ignores]
"tests/**" = ["S"]

[lint.isort]
known-first-party = ["backend", "admission_check", "check_pins", "make_secrets"]
