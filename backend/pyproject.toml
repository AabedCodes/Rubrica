[project]
name = "rubrica"
version = "0.1.0"
description = "Rubrica: agent-assisted grading with human approval"
requires-python = ">=3.13,<3.14"
# Runtime dependencies are added by their owners with `uv add <pkg>` after
# running scripts/admission_check.py (CLAUDE.md). Never edit uv.lock by hand.
dependencies = [
    "alembic==1.16.2",
    "pgvector==0.4.1",
    "psycopg[binary]==3.2.9",
    "sqlalchemy==2.0.41",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false
