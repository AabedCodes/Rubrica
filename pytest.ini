[pytest]
testpaths = tests
pythonpath = . scripts
addopts = -ra --strict-markers
markers =
    network: needs internet access (skipped unless RUBRICA_NETWORK_TESTS=1)
    verification: verification evidence test (tests/verification/framework.py)
    deterministic: verification test that runs in CI on every push
    probabilistic: verification test against the real model (make verify-live)
