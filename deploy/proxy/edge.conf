# edge: the only container with published ports (01-interfaces.md §2).
# Reverse proxy (accelerator mode) in front of web and the Mailpit UI, so those
# two can live on the internal network only and have no route out on any
# platform. Docker Desktop ignores enable_ip_masquerade=false, which is why a
# published container can't simply sit on a no-NAT bridge.
# Never forwards to anything except the two fixed origin servers.

http_port 8080 accel defaultsite=web no-vhost name=app_port
http_port 8025 accel defaultsite=mailpit no-vhost name=mail_port

cache_peer web     parent 8000 0 no-query originserver no-digest name=app
cache_peer mailpit parent 8025 0 no-query originserver no-digest name=mail

acl to_app  myportname app_port
acl to_mail myportname mail_port

cache_peer_access app  allow to_app
cache_peer_access app  deny all
cache_peer_access mail allow to_mail
cache_peer_access mail deny all

# Never connect anywhere except the peers above (no forward proxying).
never_direct allow all
http_access allow to_app
http_access allow to_mail
http_access deny all

cache deny all
pid_filename none
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
cache_store_log none
logfile_rotate 0
forwarded_for delete
via off
httpd_suppress_version_string on
request_header_max_size 32 KB
shutdown_lifetime 1 seconds
